<!-- Struktur HTML Ponsel -->
<div class="phone-container">

        <div class="screen-header">Jadul Converter</div>
        <textarea id="textInput" placeholder="Ketik atau tekan keypad..."></textarea>
        <div id="result" placeholder="Hasil angka akan muncul di sini"></div>

    <div class="action-buttons">

    </div>
</div>
